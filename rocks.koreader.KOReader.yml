app-id: rocks.koreader.KOReader
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: koreader
rename-appdata-file: rocks.koreader.koreader.appdata.xml
rename-desktop-file: rocks.koreader.koreader.desktop
rename-icon: koreader
separate-locales: false

finish-args:
  # For game controller access.
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  # For connectity check with `ping`.
  - --env=PATH=/app/bin:/usr/bin:/run/host/bin

modules:
  - name: koreader
    buildsystem: simple
    build-commands:
      # Extract distribution.
      - tar xvf koreader.tar.xz -C "${FLATPAK_DEST}"
      # Fix launcher.
      - sed -i -e 's/^export KO_MULTIUSER=1$/export FLATPAK=1/' /app/lib/koreader/koreader.sh
      # Make sure host fonts are honored.
      - ln -s /run/host/user-fonts /app/lib/koreader/fonts/host

    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/koreader/koreader/releases/download/v2026.03/koreader-linux-x86_64-v2026.03.tar.xz
        sha256: 2fe4e5bb7973e30e3a3932f9370b549d6cc26272acaba471c35ebcaf81c741af
        dest-filename: koreader.tar.xz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/koreader/koreader/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "koreader-linux-x86_64-" + $version + ".tar.xz") | .browser_download_url
          is-main-source: true

      - type: file
        only-arches: [aarch64]
        url: https://github.com/koreader/koreader/releases/download/v2026.03/koreader-linux-arm64-v2026.03.tar.xz
        sha256: f50304e54ca295860bbddb836873e8a43d677f65832586f707bacd9533152ad6
        dest-filename: koreader.tar.xz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/koreader/koreader/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "koreader-linux-arm64-" + $version + ".tar.xz") | .browser_download_url
