app-id: rocks.koreader.KOReader
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: koreader
separate-locales: false

finish-args:
  # For game controller access.
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  # For connectity check with `ping`.
  - --env=PATH=/app/bin:/usr/bin:/run/host/bin

modules:
  - name: koreader
    buildsystem: simple
    build-commands:
      # Extract distribution.
      - tar xvf koreader.tar.xz -C "${FLATPAK_DEST}"
      # Fix launcher.
      - sed -i -e 's/^export KO_MULTIUSER=1$/export FLATPAK=1/' /app/lib/koreader/koreader.sh
      # Make sure host fonts are honored.
      - ln -s /run/host/user-fonts /app/lib/koreader/fonts/host
    cleanup:
      # Prefer runtime libraries when possible.
      - /lib/koreader/libs/libfreetype.so.*
      - /lib/koreader/libs/libfribidi.so.*
      - /lib/koreader/libs/libgif.so.*
      - /lib/koreader/libs/libharfbuzz.so.*
      - /lib/koreader/libs/libpng16.so.*
      - /lib/koreader/libs/libSDL3.so.*
      - /lib/koreader/libs/libsharpyuv.so.*
      - /lib/koreader/libs/libsqlite3.so.*
      - /lib/koreader/libs/libwebp.so.*
      - /lib/koreader/libs/libwebpdemux.so.*
      - /lib/koreader/libs/libxxhash.so.*
      - /lib/koreader/libs/libz.so.*
      - /lib/koreader/libs/libzstd.so.*

    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-linux-x86_64-v2026.07.1.tar.xz
        sha256: 299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0
        dest-filename: koreader.tar.xz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/koreader/koreader/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "koreader-linux-x86_64-" + $version
            + ".tar.xz") | .browser_download_url
          is-main-source: true

      - type: file
        only-arches: [aarch64]
        url: https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-linux-arm64-v2026.07.1.tar.xz
        sha256: 68b399a99a88bf3f036f5e8b67d043215a28e11d375cf0823900aef7b1523a0b
        dest-filename: koreader.tar.xz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/koreader/koreader/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "koreader-linux-arm64-" + $version
            + ".tar.xz") | .browser_download_url
